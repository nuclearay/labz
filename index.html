<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LABZ">
  <title>LABZ</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/labz-192.png">
  <link rel="apple-touch-icon" href="icons/labz-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/labz-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: #0d1117;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .28s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
    }
    #splash h1 {
      margin: 16px 0 0;
      font-size: 28px;
      letter-spacing: .14em;
      font-weight: 700;
    }
    #splash p {
      margin: 8px 0 0;
      color: #8b949e;
      font-size: 13px;
    }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    #fallback {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      text-align: center;
      z-index: 2;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #fallback a {
      color: #8b949e;
      text-decoration: none;
    }
    #fallback a:hover,
    #fallback a:focus {
      color: #c9d1d9;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <img class="pulse" src="icons/labz-192.png" alt="" width="96" height="96">
    <h1>LABZ</h1>
    <p>Loading your labs…</p>
  </div>
  <iframe
    id="labz"
    title="LABZ"
    src="https://script.google.com/macros/s/AKfycbzqwh1EYWuTO9BzcFmDOVDUCDpQbxOS030-MjVXMUy4-YxzoPqAS-azVpwMChYWQaay3w/exec"
    allow="clipboard-write; fullscreen"></iframe>
  <div id="fallback">
    <a href="https://script.google.com/macros/s/AKfycbzqwh1EYWuTO9BzcFmDOVDUCDpQbxOS030-MjVXMUy4-YxzoPqAS-azVpwMChYWQaay3w/exec" target="_top">Open LABZ directly</a>
  </div>
  <script>
    (function () {
      var frame = document.getElementById('labz');
      var splash = document.getElementById('splash');
      var fallback = document.getElementById('fallback');
      var loaded = false;
      function hideSplash() {
        loaded = true;
        splash.classList.add('hide');
        fallback.style.display = 'none';
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 320);
      }
      frame.addEventListener('load', hideSplash);
      setTimeout(function () {
        if (!loaded) fallback.style.display = 'block';
      }, 8000);
    })();
  </script>
</body>
</html>
